<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="description" content="Michelle is a 3D designer creating playful objects and little worlds through form, materials, light and motion." />
    <title>Michelle — 3D Designer</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  </head>
  <body>
    <main>
      <section class="journey" aria-label="Michelle — 3D Designer">
        <div class="stage">
          <div class="scene" aria-hidden="true"></div>
          <div class="hero">
            <div class="hero-composition">
              <h1 class="hero-title" aria-label="Hi, I'm Michelle"><span class="title-line">HI, I'M MICHELLE</span></h1>
              <p class="subtitle"><span>CURIOUS IDEAS BECOME PLAYFUL OBJECTS.</span><span>SMALL WORLDS SHAPED THROUGH FORM,</span><span>TACTILE MATERIALS AND LIGHT.</span><span>A LITTLE MOTION BRINGS THEM TO LIFE.</span></p>
              <div class="avatar" aria-hidden="true"></div>
              <p class="hero-footer"><span class="title-line">PLAYFUL DIMENSIONS</span></p>
              <div class="social-balls" aria-hidden="true"></div>
            </div>
          </div>
          <section class="portfolio" aria-label="Selected 3D work" aria-hidden="true" inert></section>
        </div>
      </section>
      <section class="contact" aria-labelledby="contact-heading">
        <div class="contact-composition">
          <h2 class="contact-heading" id="contact-heading"><span>Want to</span><span>reach out?</span></h2>
          <a class="contact-email" href="mailto:hello@example.com">hello@example.com</a>
          <div class="contact-balls" aria-hidden="true"></div>
          <div class="contact-socials" aria-label="Social networks"><span>X / TWITTER</span><span>PINTEREST</span><span>BEHANCE</span></div>
        </div>
      </section>
    </main>
    <dialog class="project-dialog" aria-labelledby="project-title">
      <button class="project-close" type="button" aria-label="Close project">Close ×</button>
      <img class="project-image" alt="" />
      <div class="project-info"><p class="project-discipline"></p><h2 id="project-title"></h2><p class="project-description"></p></div>
    </dialog>
    <noscript><style>.journey{height:100vh}</style></noscript>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
